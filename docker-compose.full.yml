version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financial_control_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_control
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_control"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - financial_network
    restart: unless-stopped

  # pgAdmin para gerenciamento (opcional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financial_control_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - financial_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  financial_network:
    driver: bridge

